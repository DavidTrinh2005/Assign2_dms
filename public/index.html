<!DOCTYPE html>
<html>
    
    <head>
    <title>Icon Template Square</title>
        <style>
            .row{
                width:720px;
                margin: 10px auto 10px auto ;
            }
            .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
            }
        </style>
    </head>

    <body>

        <div class="row">
            <div class="image-container"><img id="Ball1_id" src="img/Ball1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Fit1_id" src="img/Fit1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Dri1_id" src="img/Dri1.png" height="200" width="200"/></div>
        </div>

        <div class="row">
            <div class="image-container"><img id="Ate1_id" src="img/Ate1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Pre1_id" src="img/Pre1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Run1_id" src="img/Run1.png" height="200" width="200"/></div>
            </div>

        <div class="row">
            <div class="image-container"><img id="Ste1_id" src="img/Ste1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Goa1_id" src="img/Goa1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="Gym1_id" src="img/Gym1.png" height="200" width="200"/></div>
        </div>
        
    </body>
    
</html> 

<script>
    const Gym1_el = document.getElementById ('Gym1_id')
    const Gym1_sound = new Audio ('Sounds/Gym.mp3')
    Gym1_el.onpointerdown = () => {
        Gym1_el.src = 'img/Gym2.png'
        Gym1_sound.play ()
        setTimeout (() => {
            Gym1_el.src = 'img/Gym1.png'
        }, 300)
    }

        Ste1_el.src = 'img/Ste2.png'

        setTimeout (() => {

        }, 300)
    }

    const Goa1_el = document.getElementById ('Goa1_id')
    const Goa1_sound = new Audio ('Sounds/Gold.mp3')
    Goa1_el.onpointerdown = () => {
        Goa1_el.src = 'img/Goa2.png'
        Goa1_sound.play ()
        setTimeout (() => {

    }

    
    
    
    

</script>
