<!DOCTYPE html>
<html>
    
    <head>
    <title>Icon Template Square</title>
        <style>
            .row{
                width:720px;
                margin: 10px auto 10px auto ;
            }
            .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
            }
        </style>
    </head>

    <body>

        <div class="row">
            <div class="image-container"><img id="cir_id" src="img/cir.png" height="200" width="200"/></div>
            <div class="image-container"><img id="tri_id" src="img/tri.png" height="200" width="200"/></div>
            <div class="image-container"><img id="squ_id" src="img/squ.png" height="200" width="200"/></div>
        </div>

        <div class="row">
            <div class="image-container"><img id="hex_id" src="img/hex.png" height="200" width="200"/></div>
            <div class="image-container"><img id="rec_id" src="img/rec.png" height="200" width="200"/></div>
            <div class="image-container"><img id="sta_id" src="img/sta.png" height="200" width="200"/></div>
            </div>

        <div class="row">
            <div class="image-container"><img id="trr_id" src="img/trr.png" height="200" width="200"/></div>
            <div class="image-container"><img src="img/sqr.png" height="200" width="200"/></div>
            <div class="image-container"><img src="img/her.png" height="200" width="200"/></div>
        </div>
        
    </body>
    
</html>

<script>
    const cir_el = document.getElementById ('cir_id')
    const cir_sound = new Audio ('Sounds/ZOOM0013.WAV')
    cir_el.onpointerdown = () => {
        cir_el.src = 'img/tri.png'
        cir_sound.play ()
        setTimeout (() => {
            cir_el.src = 'img/cir.png'
        }, 1000)
    }
